<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SyncBee — Bundle Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .topbar { background: var(--navy); color: white; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
  .back-link { color: #B9C6D6; text-decoration: none; font-size: 14px; }
  .content { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  .bundle-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(15,38,71,0.08); }
  .bundle-head { background: linear-gradient(135deg, var(--navy-light) 0%, var(--navy) 100%); color: white; padding: 28px 32px; }
  .bundle-head h1 { font-size: 22px; margin-bottom: 6px; }
  .bundle-body { padding: 28px 32px; }
  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--bg); border-radius: 10px; margin-bottom: 10px; }
  .item-row.locked { opacity: 0.5; }
  .item-num { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; margin-right: 12px; }
  .item-left { display: flex; align-items: center; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .status-pill.not_started { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
  .status-pill.in_progress { background: #EFF6FF; color: #1E40AF; }
  .status-pill.submitted { background: #ECFDF5; color: var(--emerald-dark); }
  .action { text-align: center; margin-top: 20px; }
  .loading { text-align: center; padding: 80px 20px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="topbar">SyncBee <a href="/dashboard" class="back-link">← Back to Dashboard</a></div>

<div class="content" id="content"><div class="loading">Loading bundle...</div></div>

<script>
const API = window.location.origin;
const params = new URLSearchParams(window.location.search);
const bundleCode = params.get('bundle_code');

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }

async function load() {
  try {
    const res = await fetch(`${API}/api/student/bundle-details?bundle_code=${encodeURIComponent(bundleCode)}`);
    const data = await res.json();
    if (!data.success) { document.getElementById('content').innerHTML = `<div class="loading">${escapeHtml(data.message)}</div>`; return; }
    render(data);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="loading">Connection failed: ${escapeHtml(err.message)}</div>`;
  }
}

let currentNavMode = 'strict_sequential';
function render(data) {
  const { bundle, items, bundle_attempt } = data;
  currentNavMode = bundle.navigation_mode;
  const statusLabels = { not_started: 'Not Started', in_progress: 'In Progress', submitted: 'Submitted' };

  const itemsHtml = items.map(item => `
    <div class="item-row ${item.locked ? 'locked' : ''}">
      <div class="item-left"><span class="item-num">${item.item_order}</span> ${escapeHtml(item.exam_title)} (${item.duration_minutes} min)</div>
      <span class="status-pill ${item.status}">${item.locked ? '🔒 Locked' : statusLabels[item.status]}</span>
    </div>`).join('');

  const allSubmitted = items.every(i => i.status === 'submitted');
  const buttonLabel = bundle_attempt && bundle_attempt.status === 'In Progress' ? 'Continue Bundle' : 'Start Bundle';

  document.getElementById('content').innerHTML = `
    <div class="bundle-card">
      <div class="bundle-head">
        <h1>📦 ${escapeHtml(bundle.bundle_title)}</h1>
        <p style="color:#B9C6D6; font-size:13px;">${escapeHtml(bundle.description || '')}</p>
      </div>
      <div class="bundle-body">
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
          Total time budget: <strong>${bundle.total_duration_minutes} minutes</strong> shared across all ${items.length} exams.
          Navigation: <strong>${bundle.navigation_mode.replace('_', ' ')}</strong>.
        </p>
        ${itemsHtml}
        <div class="action">
          ${allSubmitted
            ? `<button class="btn btn-ghost" disabled>Bundle Completed</button>`
            : `<button class="btn btn-primary" onclick="startBundleAttempt()">${buttonLabel}</button>`}
        </div>
      </div>
    </div>`;
}

async function startBundleAttempt() {
  try {
    const res = await fetch(`${API}/api/bundle-attempts/start`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bundle_code: bundleCode })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Could not start bundle.'); return; }

    window.location.href = `/exam-taking?attempt_id=${encodeURIComponent(data.attempt_id)}&section=A` +
      `&bundle_attempt_id=${encodeURIComponent(data.bundle_attempt_id)}` +
      `&item_order=${data.current_item_order}&total_items=${data.total_items}` +
      `&remaining_seconds=${data.remaining_seconds}&nav_mode=${encodeURIComponent(currentNavMode)}` +
      `&bundle_code=${encodeURIComponent(bundleCode)}`;
  } catch (err) {
    alert('Connection failed: ' + err.message);
  }
}

load();
</script>

</body>
</html>
