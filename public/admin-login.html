<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SyncBee | Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome (Eye Icon) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="/style.css">

<style>
  * { box-sizing: border-box; }

  body {
    height: auto;
    overflow-x: hidden;
    overflow-y: auto;
     min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    font-family: 'Manrope', sans-serif;
    padding: 24px;
    gap: 18px;
  }

   body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 40px 36px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0,0,0,0.28);
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 6px;
    color: var(--navy);
  }

  .brand .img {
    height: 45px;
    width: auto;
    display: block;
  }

  h2 {
    text-align: center;
    font-size: 18px;
    margin: 14px 0 4px;
    font-family: 'Poppins', sans-serif;
    color: var(--navy);
  }

  .sub {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 22px;
    line-height: 1.5;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
    margin-top: 14px;
    color: var(--text);
  }

  .password-wrapper {
    position: relative;
  }

  .password-wrapper .input {
    padding-right: 50px;
  }

  .password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    color: #777;
    font-size: 18px;
    padding: 0;
  }

  .password-toggle:hover {
    color: #111;
  }

  /* POWERED BY — outside the card */
  .powered-by {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.3px;
    line-height: 1.5;
    padding: 4px 0 8px;
    font-family: 'Manrope', sans-serif;
    flex-wrap: wrap;
    text-align: center;
  }

  /* Mariobee logo beside the text */
  .powered-by .company-logo {
    height: 20px;
    width: auto;
    display: block;
    opacity: 0.9;
    filter: brightness(1.05);
  }

  .powered-by strong {
    color: rgba(255,255,255,0.9);
    font-weight: 600;
  }

  .powered-by .brand-name {
    color: #f5c542; /* subtle bee-gold accent */
    font-weight: 700;
  }

    /* Logo in the card */
  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 6px;
  }

  .logo-wrap img {
    display: block;
    height: 44px;          /* match the sidebar / student login scale */
    width: auto;
    max-width: 100%;
    object-fit: contain;
  }
</style>

</head>

<body>

<div class="card">

<div class="logo-wrap">
  <img id="brandLogo" data-brand-logo
       src="./img/syncbee2.png"
       onerror="this.onerror=null; this.src='./img/syncbee2.png';"
       alt="SyncBee Logo">
</div>


  <h2>Admin Login</h2>

  <div class="sub">
    Sign in with the email and password set during activation.
  </div>

  <div id="alertBox" class="alert alert-error"></div>

  <form id="loginForm">

    <label for="email">Email</label>
    <input
      class="input"
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
      autofocus
    >

    <label for="password">Password</label>

    <div class="password-wrapper">

      <input
        class="input"
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        id="togglePassword"
        class="password-toggle"
        aria-label="Show Password"
      >
        <i class="fa-regular fa-eye"></i>
      </button>

    </div>

    <button
      type="submit"
      class="btn btn-primary"
      id="loginBtn"
      style="width:100%;margin-top:22px;"
    >
      Log In
    </button>

  </form>

</div>


<!-- POWERED BY — sits outside the card, with Mariobee logo -->
<div class="powered-by">
  <img src="./img/mariobee.png" alt="Mariobee Technologies" class="company-logo">
  <span>Powered by <strong class="brand-name">SyncBee</strong> · <strong>Mariobee Technologies Limited</strong></span>
</div>

<script src="/branding.js"></script>
<script>
// ── Branding: load custom logo set in Settings → Branding ──────────
(async function loadBrandLogo() {
  const img = document.getElementById('brandLogo');
  if (!img) return;

  // Where to cache the last known good logo so login is instant on reload
  const CACHE_KEY = 'syncbee_brand_logo';
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) img.src = cached;

  try {
    const res = await fetch('/api/admin/branding/public', {
      credentials: 'same-origin',
      cache: 'no-store'
    });
    if (!res.ok) return;

    const data = await res.json();

    // Accept several common shapes the backend might return:
    //   { logo_url: "..." }
    //   { logo: "..." }
    //   { logo_data: "data:image/png;base64,..." }
    //   { branding: { logo_url: "..." } }
    const logo =
      data.logo_url ||
      data.logo ||
      data.logo_data ||
      (data.branding && (data.branding.logo_url || data.branding.logo));

    if (!logo) return;

    // Only update if it's actually different
    if (img.getAttribute('src') !== logo) {
      img.src = logo;
      localStorage.setItem(CACHE_KEY, logo);
    }

    // If the custom logo fails to load, fall back to the default
    img.onerror = () => {
      img.onerror = null;
      img.src = './img/syncbee2.png';
      localStorage.removeItem(CACHE_KEY);
    };

  } catch (_) {
    // Network error — keep whatever we already have (cache or default)
  }
})();
</script>
<script>

const API = window.location.origin;

// Restore last email
const savedEmail = localStorage.getItem('syncbee_admin_email');

if (savedEmail) {
    document.getElementById('email').value = savedEmail;
}

// Show / Hide Password
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
const icon = togglePassword.querySelector('i');

togglePassword.addEventListener('click', () => {

    const hidden = passwordInput.type === 'password';

    passwordInput.type = hidden ? 'text' : 'password';

    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');

});

// Login handler
document.getElementById('loginForm').addEventListener('submit', async (e) => {

    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    const btn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('alertBox');

    alertBox.classList.remove('show');

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {

        const res = await fetch(`${API}/api/auth/admin-login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await res.json();

        if (data.success) {

            // Remember email
            localStorage.setItem('syncbee_admin_email', email);

            window.location.href = '/admin-dashboard';

        } else {

            alertBox.textContent = data.message || 'Login failed.';
            alertBox.classList.add('show');

            btn.disabled = false;
            btn.textContent = 'Log In';

        }

    } catch (err) {

        alertBox.textContent = 'Connection failed: ' + err.message;
        alertBox.classList.add('show');

        btn.disabled = false;
        btn.textContent = 'Log In';

    }

});

</script>

<script>
// If the license isn't usable, don't show a login box that can't work.
fetch('/api/license/public-status')
    .then(r => r.json())
    .then(s => {

        if (s.mode === 'unactivated') {
            window.location.href = '/activate';
        } else if (s.mode === 'locked') {
            window.location.href = '/license-locked';
        }

    })
    .catch(() => {});
</script>

</body>
</html>
