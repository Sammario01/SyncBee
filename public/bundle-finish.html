<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SyncBee — Bundle Complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 18px; padding: 44px 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 4px 20px rgba(15,38,71,0.1); }
  .check-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--emerald); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 14px; text-align: left; }
  .breakdown-total { display: flex; justify-content: space-between; padding: 14px 0 0; font-weight: 700; font-size: 16px; }
  .score-box { background: var(--bg); border-radius: 10px; padding: 16px; margin-top: 16px; font-size: 14px; }
  .actions { margin-top: 24px; }
</style>
</head>
<body>
<div class="card" id="card"><div class="check-icon">✓</div><h1>Loading...</h1></div>

<script>
const API = window.location.origin;
const params = new URLSearchParams(window.location.search);
const bundleAttemptId = params.get('bundle_attempt_id');

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }

history.pushState(null, null, window.location.href);
window.addEventListener('popstate', () => {
  alert('This bundle has already been submitted.');
  history.pushState(null, null, window.location.href);
});

async function load() {
  try {
    const res = await fetch(`${API}/api/student/bundle-finish?bundle_attempt_id=${encodeURIComponent(bundleAttemptId)}`);
    const data = await res.json();
    if (!data.success) { document.getElementById('card').innerHTML = `<h1>${escapeHtml(data.message)}</h1>`; return; }
    render(data);
  } catch (err) {
    document.getElementById('card').innerHTML = `<h1>Connection failed</h1>`;
  }
}

function formatDuration(totalSeconds) {
  if (totalSeconds === null || totalSeconds === undefined) return '—';
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}m ${s}s`;
}

function render(data) {
  let scoreHtml;
  if (data.score_display.visible) {
    const rows = data.score_display.breakdown.map(b => `
      <div class="breakdown-row">
        <span>${escapeHtml(b.exam_title)}<br><span style="font-size:11px; color:var(--text-muted);">Time spent: ${formatDuration(b.time_spent_seconds)}</span></span>
        <span>${b.attempted ? b.score : '—'} / ${b.total_marks}</span>
      </div>`
    ).join('');
    scoreHtml = `
      <div class="score-box">
        ${rows}
        <div class="breakdown-total"><span>Total</span><span>${data.score_display.combined_score} / ${data.score_display.combined_total}</span></div>
      </div>`;
  } else {
    scoreHtml = `<div class="score-box">${escapeHtml(data.score_display.text)}</div>`;
  }

  document.getElementById('card').innerHTML = `
    <div class="check-icon">✓</div>
    <h1>Bundle Complete — ${escapeHtml(data.bundle_title)}</h1>
    ${scoreHtml}
    <div class="actions">
      <button class="btn btn-primary" onclick="goDashboard()" style="width:100%;">Go to Dashboard</button>
    </div>`;
}

function goDashboard() {
  if (confirm('Return to Dashboard?')) window.location.href = '/dashboard';
}

load();
</script>
</body>
</html>
